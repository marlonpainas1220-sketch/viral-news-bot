<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRINIII | SOCIAL DOPAMINE</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FF2D55; --bg: #050505; --card: #121212; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; overflow-x: hidden; }

        /* Secret Arsenal Trigger */
        #h-l, #h-r { position: fixed; top: 0; width: 80px; height: 80px; z-index: 100000; }
        #h-l { left: 0; } #h-r { right: 0; }

        /* Splash Dinâmica */
        #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: 0.8s; }
        .logo-hq { width: 140px; height: 140px; border-radius: 40px; border: 3px solid var(--pink); box-shadow: 0 0 40px var(--pink); object-fit: cover; }

        /* Header TikTok Style */
        header { height: 75px; display: flex; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000; border-bottom: 0.5px solid #222; }
        .logo { font-family: 'Syncopate', sans-serif; font-size: 20px; letter-spacing: -1px; }
        .logo span { color: var(--pink); }

        /* Smart Tabs */
        .scroller { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; scrollbar-width: none; background: var(--bg); }
        .chip { padding: 10px 22px; background: var(--card); border-radius: 50px; font-size: 11px; font-weight: 900; white-space: nowrap; color: #555; border: 1px solid #222; transition: 0.3s; }
        .chip.active { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: 0 4px 15px rgba(255,45,85,0.3); }

        /* News Cards: Desejo Inconsciente */
        #feed { padding: 0 15px; }
        .post { background: var(--card); border-radius: 35px; margin-bottom: 25px; overflow: hidden; border: 1px solid #1a1a1a; position: relative; }
        .post-img-box { width: 100%; height: 420px; position: relative; }
        .post-img { width: 100%; height: 100%; object-fit: cover; }
        .post-gradient { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 50%); }
        .post-tag { position: absolute; top: 20px; left: 20px; background: var(--pink); padding: 6px 15px; border-radius: 12px; font-size: 10px; font-weight: 900; letter-spacing: 1px; }
        .post-content { padding: 25px; }
        .post-title { font-size: 24px; font-weight: 900; line-height: 1.1; letter-spacing: -0.5px; }

        /* Tabbar */
        .tabbar { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(20,20,20,0.9); backdrop-filter: blur(20px); border-radius: 40px; display: flex; justify-content: space-around; align-items: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tab-icon { color: #444; font-size: 9px; font-weight: 900; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-icon.active { color: var(--pink); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="h-l"></div><div id="h-r"></div>

    <div id="splash">
        <img src="icon.png.JPG" class="logo-hq">
        <div style="margin-top:25px; font-family:'Syncopate'; font-size:12px; letter-spacing:4px; color:var(--pink);">UPLINKING...</div>
    </div>

    <header><div class="logo">VITRIN<span>III</span></div></header>

    <div class="scroller">
        <div class="chip active" onclick="V3.tab('news', this)">🔥 SEU RADAR</div>
        <div class="chip" onclick="V3.tab('charts', this)">📊 CHARTS GLOBAL</div>
        <div class="chip" onclick="V3.tab('trends', this)">🐦 TWITTER TRENDS</div>
        <div class="chip" onclick="V3.tab('station', this)">📻 ESTAÇÃO V3</div>
    </div>

    <main id="view-news"><div id="feed"></div></main>

    <section id="view-station" style="display:none; text-align:center; padding:50px 20px;">
        <img src="icon.png.JPG" style="width:220px; border-radius:40px; border:2px solid var(--pink); box-shadow:0 15px 40px rgba(255,45,85,0.2);">
        <h1 style="font-size:32px; font-weight:900; margin-top:30px;">ESTAÇÃO V3</h1>
        <button onclick="V3.play()" style="background:#fff; color:#000; border:none; padding:18px 50px; border-radius:50px; font-weight:900; margin-top:20px;">PLAY BROADCAST</button>
    </section>

    <footer class="tabbar">
        <div class="tab-icon active" onclick="location.reload()">HOME</div>
        <div class="tab-icon" onclick="V3.tab('news', this)">FEED</div>
        <a href="https://www.tiktok.com/@vitriniii" class="tab-icon">TIKTOK</a>
    </footer>

    <script src="core.js"></script>
    <script>
        window.onload = () => { V3.init(); setTimeout(() => document.getElementById('splash').style.display='none', 2500); };
        let l=0, r=0;
        document.getElementById('h-l').onclick=()=>{l++;chk();};
        document.getElementById('h-r').onclick=()=>{r++;chk();};
        function chk(){ if(l>=2 && r>=2){location.href='dashboard.html'; l=0; r=0;} setTimeout(()=>{l=0;r=0;},2000);}
    </script>
</body>
</html>
