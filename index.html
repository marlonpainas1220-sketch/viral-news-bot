<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRIN III | SINAL SOBERANO</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --yellow: #FFFF00; --bg: #000; --card: #0A0A0A; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; outline: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; padding-bottom: 90px; overflow-x: hidden; }
        
        /* Splash Screen */
        #splash { position: fixed; inset: 0; background: var(--yellow); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 0.8s ease-in-out; }
        .persona-img { width: 150px; height: 150px; border-radius: 50%; border: 6px solid #000; object-fit: cover; }

        /* Header */
        .header { height: 70px; display: flex; align-items: center; justify-content: center; background: #000; border-bottom: 2px solid var(--yellow); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 24px; color: var(--yellow); text-transform: uppercase; }

        /* Abas */
        .tabs { display: flex; background: #000; border-bottom: 1px solid #1a1a1a; position: sticky; top: 70px; z-index: 999; }
        .tab { flex: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #444; text-transform: uppercase; letter-spacing: 1px; }
        .tab.active { color: var(--yellow); border-bottom: 3px solid var(--yellow); }

        /* Ads Container */
        .ads-slot { background: #080808; height: 70px; display: flex; align-items: center; justify-content: center; font-size: 9px; color: #333; border-bottom: 1px solid #1a1a1a; letter-spacing: 2px; font-weight: 900; }

        /* Feed */
        #feed { padding: 15px; }
        .card { background: var(--card); border-radius: 25px; margin-bottom: 25px; overflow: hidden; border: 1px solid #1a1a1a; position: relative; }
        .card img { width: 100%; height: 260px; object-fit: cover; border-bottom: 1px solid var(--yellow); }
        .persona-badge { position: absolute; top: -35px; right: 25px; width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--yellow); background-image: url('icon.png.JPG'); background-size: cover; background-position: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Rádio Box */
        .radio-box { padding: 20px; text-align: center; }
        .tabbar { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-top: 1px solid #1a1a1a; display: flex; justify-content: space-around; align-items: center; }
        .tk-btn { background: #fff; color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 900; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="icon.png.JPG" class="persona-img" onerror="this.src='https://via.placeholder.com/150/FFFF00/000000?text=VITRIN'">
        <div style="margin-top:20px; font-weight:900; color:#000; letter-spacing:4px;">VITRIN III</div>
    </div>
    
    <div class="header"><div class="logo">Vitrin III</div></div>
    <div class="ads-slot">PUBLICIDADE GOOGLE ADSENSE</div>

    <div class="tabs">
        <div class="tab active" onclick="Soberano.tab('news', this)">Feed</div>
        <div class="tab" onclick="Soberano.tab('radio', this)">Estação</div>
        <div class="tab" onclick="Soberano.tab('opinion', this)">Redação</div>
    </div>

    <div id="view-news"><div id="feed"></div></div>

    <div id="view-radio" style="display:none;">
        <div class="radio-box">
            <h2 id="radio-status" style="color:var(--yellow); font-size:16px;">SINAL DE RÁDIO OFF</h2>
            <button onclick="Soberano.play()" style="background:var(--yellow); border:none; padding:15px 35px; font-weight:900; border-radius:50px; cursor:pointer;">LIGAR LOCUTOR</button>
            <div style="margin-top:30px;">
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZECX0S560" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <div id="view-opinion" style="display:none; padding:20px;"><div id="opinion-content"></div></div>

    <footer class="tabbar">
        <a href="#" class="tk-btn" onclick="location.reload()">ATUALIZAR</a>
        <a href="https://www.tiktok.com/@vitriniii" target="_blank" class="tk-btn">SIGA NO TIKTOK</a>
    </footer>

    <script src="core.js"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>
    <script>
        window.onload = () => { 
            Soberano.init(); 
            setTimeout(() => { document.getElementById('splash').style.transform='translateY(-100%)'; }, 2000); 
        };
    </script>
</body>
</html>
