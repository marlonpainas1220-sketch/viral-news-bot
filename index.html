<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral News | Fofocas Quentes</title>
    <style>
        :root { --amarelo: #F9CF04; }
        body { background: #FFFFFF; font-family: 'Arial', sans-serif; margin: 0; color: #1a1a1a; }
        header { 
            padding: 15px; 
            text-align: center; 
            border-bottom: 2px solid #f2f2f2; 
            position: sticky; 
            top: 0; 
            background: #fff; 
            z-index: 100; 
        }
        .logo { font-weight: 900; font-size: 26px; letter-spacing: -1px; }
        .feed { max-width: 500px; margin: auto; padding: 15px; }
        .card { 
            border-radius: 15px; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border-bottom: 6px solid var(--amarelo); 
            overflow: hidden; 
            background: #fff;
        }
        .card img { width: 100%; height: auto; display: block; background: #eee; }
        .info { padding: 15px; }
        .badge { 
            background: var(--amarelo); 
            font-size: 10px; 
            font-weight: bold; 
            padding: 5px 10px; 
            border-radius: 5px; 
            text-transform: uppercase;
        }
        h3 { margin: 10px 0; font-size: 20px; line-height: 1.3; }
        small { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <div class="logo">VIRAL<span style="color:var(--amarelo)">NEWS</span></div>
    </header>

    <div id="feed" class="feed">
        <p style="text-align:center;">Buscando as últimas fofocas...</p>
    </div>

    <script>
        // Blindagem: Configurações do Supabase
        const API_URL = "https://rwqowtbeetzwrljrpdmh.supabase.co/rest/v1/noticias?select=*";
        const SUPABASE_KEY = "SUA_ANON_KEY_AQUI"; // Pegue em Settings > API

        async function carregarNoticias() {
            const feedElement = document.getElementById('feed');
            try {
                const response = await fetch(API_URL, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const noticias = await response.json();

                if (noticias.length === 0) {
                    feedElement.innerHTML = "<p style='text-align:center;'>Nenhuma fofoca encontrada ainda. O robô está trabalhando!</p>";
                    return;
                }

                feedElement.innerHTML = noticias.reverse().map(n => `
                    <div class="card">
                        <img src="${n.imagem || 'https://via.placeholder.com/600x400?text=Viral+News'}" alt="Notícia">
                        <div class="info">
                            <span class="badge">${n.categoria || 'FAMOSOS'}</span>
                            <h3>${n.titulo}</h3>
                            <small>Fonte: ${n.fonte || 'Viral News'}</small>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                feedElement.innerHTML = "<p style='text-align:center; color:red;'>Erro ao conectar com o servidor. Tente novamente mais tarde.</p>";
            }
        }
        carregarNoticias();
    </script>
</body>
</html>
