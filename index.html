<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRIN III | SINAL SOBERANO</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --y: #FFFF00; --b: #000; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; box-sizing: border-box; }
        body { margin: 0; background: var(--b); color: #fff; font-family: sans-serif; padding-bottom: 110px; overflow-x: hidden; }
        #splash { position: fixed; inset: 0; background: var(--y); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 0.8s; }
        .persona-img { width: 140px; height: 140px; border-radius: 50%; border: 6px solid #000; object-fit: cover; }
        .header { height: 70px; display: flex; align-items: center; justify-content: center; background: #000; border-bottom: 2px solid var(--y); position: sticky; top: 0; z-index: 1000; color: var(--y); font-weight: 900; font-size: 22px; text-transform: uppercase; }
        .tabs { display: flex; background: #000; border-bottom: 1px solid #1a1a1a; position: sticky; top: 70px; z-index: 999; }
        .tab { flex: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #444; text-transform: uppercase; }
        .tab.active { color: var(--y); border-bottom: 3px solid var(--y); }
        .tabbar { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(0,0,0,0.95); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; padding-bottom: env(safe-area-inset-bottom); }
        .btn-v3 { background: #fff; color: #000; padding: 10px 20px; border-radius: 50px; font-weight: 900; text-decoration: none; font-size: 11px; }
    </style>
</head>
<body>
    <div id="splash">
        <img src="icon.png.JPG" class="persona-img">
        <div style="margin-top:20px; font-weight:900; color:#000;">VITRIN III</div>
    </div>
    <div class="header">VITRIN III</div>
    <div class="tabs">
        <div class="tab active" onclick="Soberano.tab('news', this)">Feed</div>
        <div class="tab" onclick="Soberano.tab('radio', this)">Estação</div>
        <div class="tab" onclick="Soberano.tab('opinion', this)">Redação</div>
    </div>
    <div id="view-news"><div id="feed" style="padding:15px;"></div></div>
    <div id="view-radio" style="display:none; padding:30px; text-align:center;">
        <h2 id="radio-status" style="color:var(--y)">ESTAÇÃO VITRINIII OFF</h2>
        <button onclick="Soberano.play()" style="background:var(--y); border:none; padding:15px 40px; font-weight:900; border-radius:50px; cursor:pointer;">LIGAR LOCUTOR IA</button>
        <p style="margin-top:20px; color:#444; font-size:12px;">O sinal da rádio requer comando do Admin.</p>
    </div>
    <div id="view-opinion" style="display:none; padding:20px;"><div id="opinion-content"></div></div>
    <footer class="tabbar">
        <a href="#" class="btn-v3" onclick="location.reload()">ATUALIZAR</a>
        <a href="https://www.tiktok.com/@vitriniii" target="_blank" class="btn-v3">TIKTOK</a>
        <a href="dashboard.html" class="btn-v3" style="background:#222; color:#fff;">ADMIN</a>
    </footer>
    <script src="core.js"></script>
    <script>window.onload = () => { Soberano.init(); setTimeout(() => { document.getElementById('splash').style.transform='translateY(-100%)'; }, 2000); };</script>
</body>
</html>
