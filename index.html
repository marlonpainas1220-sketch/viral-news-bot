<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRIN III | SINAL AMARELO</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --amarelo: #FFFF00; --preto: #000; --cinza: #0F0F0F; --texto: #E7E9EA; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; box-sizing: border-box; outline: none; }
        body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; background: var(--preto); color: var(--texto); padding-bottom: 90px; }
        
        /* Splash Screen Blindada */
        #splash { position: fixed; inset: 0; background: var(--amarelo); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 0.8s cubic-bezier(0.19, 1, 0.22, 1); }
        .persona-img { width: 140px; height: 140px; border-radius: 50%; border: 5px solid var(--preto); object-fit: cover; }

        /* Header Estilo Tabloide */
        .nav { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(20px); z-index: 1000; border-bottom: 3px solid var(--amarelo); }
        .logo-tabloide { font-weight: 900; font-size: 26px; color: var(--amarelo); text-transform: uppercase; letter-spacing: -2px; }
        .portal { width: 40px; height: 6px; background: #222; border-radius: 10px; cursor: pointer; }

        /* Banner de Ads (Espaço Reservado) */
        .ads-container { background: #111; width: 100%; min-height: 100px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #222; margin-bottom: 10px; color: #444; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; }

        /* Navegação de Tópicos */
        .tabs { display: flex; background: var(--preto); border-bottom: 1px solid #222; position: sticky; top: 70px; z-index: 999; }
        .tab { flex: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #666; transition: 0.3s; }
        .tab.active { color: var(--amarelo); border-bottom: 4px solid var(--amarelo); }

        /* Feed Denso de Imagens */
        #feed { padding: 10px; display: grid; gap: 15px; }
        .card { background: var(--cinza); border-radius: 20px; overflow: hidden; border: 1px solid #1a1a1a; position: relative; }
        .card-media { width: 100%; height: 280px; object-fit: cover; border-bottom: 1px solid var(--amarelo); }
        .card-info { padding: 20px; position: relative; }
        .persona-badge { position: absolute; top: -35px; right: 20px; width: 65px; height: 65px; border-radius: 50%; border: 3px solid var(--amarelo); background-image: url('icon.png.JPG'); background-size: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .manchete { font-size: 20px; font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-transform: uppercase; }
        .teaser { font-size: 14px; color: #888; line-height: 1.4; margin: 0; }
        
        /* Tab Bar Flutuante */
        .tabbar { position: fixed; bottom: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .icon-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #444; }
        .icon-btn.active { color: var(--amarelo); }
        .icon-btn span { font-size: 24px; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="splash">
        <img src="icon.png.JPG" class="persona-img" onerror="this.src='https://via.placeholder.com/140/FFFF00/000000?text=VITRIN'">
        <div style="margin-top:20px; font-weight:900; color:#000; font-size:18px; letter-spacing:4px;">VITRIN III</div>
    </div>
    
    <nav class="nav">
        <div class="logo-tabloide">Vitrin<span style="color:#fff">III</span></div>
        <div class="portal" id="portal-trigger"></div>
    </nav>

    <div class="ads-container">Espaço para Publicidade</div>

    <div class="tabs">
        <div class="tab active" id="btn-hype" onclick="Soberano.carregar('HYPE')">HYPE</div>
        <div class="tab" id="btn-subs" onclick="Soberano.carregar('SUBS')">SUBCELEBS</div>
        <div class="tab" id="btn-trend" onclick="Soberano.carregar('X')">TRENDS</div>
    </div>
    
    <div id="feed"></div>

    <footer class="tabbar">
        <div class="icon-btn active"><span>🏠</span>INÍCIO</div>
        <div class="icon-btn"><span>⚡</span>RÁPIDAS</div>
        <div class="icon-btn"><span>⚙️</span>PAINEL</div>
    </footer>

    <script src="core.js"></script>
    <script async src="https://www.tiktok.com/embed.js"></script>
    <script>
        window.onload = () => {
            if (typeof Soberano !== 'undefined') Soberano.carregar('HYPE');
            setTimeout(() => { 
                const s = document.getElementById('splash');
                s.style.opacity='0'; s.style.transform='scale(1.2)';
                setTimeout(()=>s.remove(), 800); 
            }, 2000);
        };
        let t; const gat = document.getElementById('portal-trigger');
        gat.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            gat.style.background="var(--amarelo)"; 
            t=setTimeout(()=>location.href='dashboard.html',3000); 
        });
        gat.addEventListener('touchend', () => { gat.style.background="#222"; clearTimeout(t); });
    </script>
</body>
</html>
