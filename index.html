<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRINIII | SOVEREIGN SYSTEM</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --neon: #FFFF00; --bg: #000; --dark: #080808; --gray: #1a1a1a; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', -apple-system, sans-serif; overflow-x: hidden; padding-bottom: 120px; }
        
        /* Gatilhos Invisíveis (2 toques L, 2 toques R no topo) */
        #secret-l, #secret-r { position: fixed; top: 0; width: 100px; height: 100px; z-index: 100000; }
        #secret-l { left: 0; } #secret-r { right: 0; }

        /* Splash Screen Hacker */
        #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 1s; }
        .logo-hq { width: 120px; height: 120px; border-radius: 50%; border: 2px solid var(--neon); box-shadow: 0 0 30px var(--neon); object-fit: cover; animation: glitch 1s infinite; }
        
        /* Header & Tabs */
        .header { height: 80px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--gray); position: sticky; top: 0; z-index: 1000; }
        .logo-txt { font-weight: 900; letter-spacing: 8px; color: var(--neon); font-size: 20px; text-transform: uppercase; }
        
        .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-bottom: 1px solid var(--gray); position: sticky; top: 80px; z-index: 999; }
        .nav-item { height: 50px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #444; letter-spacing: 2px; }
        .nav-item.active { color: var(--neon); border-bottom: 2px solid var(--neon); background: rgba(255,255,0,0.05); }

        /* News Cards: Estética Cyber-Tabloid */
        .feed { padding: 15px; }
        .v-card { background: var(--dark); border-radius: 0; margin-bottom: 25px; border: 1px solid var(--gray); position: relative; }
        .v-card img { width: 100%; height: 300px; object-fit: cover; filter: grayscale(100%) contrast(110%); transition: 0.4s; }
        .v-card:hover img { filter: grayscale(0%); }
        .v-tag { position: absolute; top: 15px; left: 15px; background: var(--neon); color: #000; padding: 4px 10px; font-size: 9px; font-weight: 900; text-transform: uppercase; }
        .v-content { padding: 20px; }
        .v-title { font-size: 22px; font-weight: 900; line-height: 1.1; letter-spacing: -0.5px; margin: 0; }
        
        /* Estação Radio Visualizer */
        .viz-box { padding: 40px 20px; text-align: center; background: radial-gradient(circle, #111 0%, #000 100%); }
        .bar-container { display: flex; gap: 4px; justify-content: center; align-items: flex-end; height: 60px; margin-bottom: 30px; }
        .bar { width: 6px; background: var(--neon); animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { height: 10px; } to { height: 50px; } }

        /* Tabbar */
        .tabbar { position: fixed; bottom: 0; width: 100%; height: 90px; background: rgba(0,0,0,0.95); border-top: 1px solid var(--gray); display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(15px); }
        .tab-btn { color: #444; text-decoration: none; font-size: 9px; font-weight: 900; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .tab-btn.active { color: var(--neon); }
    </style>
</head>
<body>

    <div id="secret-l"></div><div id="secret-r"></div>

    <div id="splash">
        <img src="icon.png.JPG" class="logo-hq">
        <div style="margin-top:30px; color:var(--neon); font-size:10px; letter-spacing:5px;">INITIALIZING_V3_CORE</div>
    </div>

    <header class="header"><div class="logo-txt">Vitriniii</div></header>

    <nav class="nav-grid">
        <div class="nav-item active" onclick="Soberano.tab('feed', this)">LIVE_RADAR</div>
        <div class="nav-item" onclick="Soberano.tab('radio', this)">BROADCAST</div>
        <div class="nav-item" onclick="Soberano.tab('op', this)">EDITORIAL</div>
    </nav>

    <main id="v-feed" class="feed"></main>

    <section id="v-radio" style="display:none;">
        <div class="viz-box">
            <div class="bar-container">
                <div class="bar" style="animation-delay: 0.1s"></div>
                <div class="bar" style="animation-delay: 0.3s"></div>
                <div class="bar" style="animation-delay: 0.2s"></div>
                <div class="bar" style="animation-delay: 0.4s"></div>
            </div>
            <button onclick="Soberano.play()" style="background:var(--neon); border:none; padding:18px 40px; font-weight:900; letter-spacing:2px; border-radius:5px;">SINTONIZAR IA</button>
            <div style="margin-top:40px; border: 1px solid var(--gray);">
                <iframe src="https://open.spotify.com/embed/playlist/37i9dQZEVXbMXp61v9AI7o?utm_source=generator&theme=07" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
            </div>
        </div>
    </section>

    <section id="v-op" style="display:none; padding:30px;"></section>

    <footer class="tabbar">
        <div class="tab-btn active" onclick="location.reload()"><span>◈</span>REFRESH</div>
        <a href="https://www.tiktok.com/@vitriniii" class="tab-btn"><span>◎</span>TIKTOK</a>
    </footer>

    <script src="core.js"></script>
    <script>
        window.onload = () => { Soberano.init(); setTimeout(() => { document.getElementById('splash').style.opacity='0'; setTimeout(() => document.getElementById('splash').style.display='none', 1000); }, 2500); };
        
        let L=0, R=0;
        document.getElementById('secret-l').onclick = () => { L++; check(); };
        document.getElementById('secret-r').onclick = () => { R++; check(); };
        function check() { if(L>=2 && R>=2){ location.href='dashboard.html'; L=0; R=0; } setTimeout(()=>{ L=0; R=0; }, 2000); }
    </script>
</body>
</html>
