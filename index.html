<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRINIII | SOCIAL DOPAMINE</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #FF2D55; --bg: #0A0A0A; --card: #1C1C1E; --glass: rgba(255,255,255,0.1); }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Outfit', sans-serif; overflow-x: hidden; }

        /* Gatilho Oculto: 2 toques L + 2 toques R no topo */
        #h-l, #h-r { position: fixed; top: 0; width: 80px; height: 80px; z-index: 100000; }
        #h-l { left: 0; } #h-r { right: 0; }

        /* Splash Dinâmica */
        #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: 0.6s ease-in; }
        .spin-logo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--pink); object-fit: cover; box-shadow: 0 0 30px var(--pink); }

        /* Header TikTok Style */
        header { height: 70px; display: flex; align-items: center; padding: 0 20px; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #222; }
        .logo-txt { font-family: 'Syncopate', sans-serif; font-size: 18px; color: #fff; text-transform: uppercase; flex: 1; letter-spacing: -1px; }
        .logo-txt span { color: var(--pink); }

        /* Horizontal Categories */
        .cat-scroll { display: flex; gap: 12px; padding: 15px 20px; overflow-x: auto; scrollbar-width: none; background: var(--bg); }
        .chip { padding: 8px 20px; background: var(--card); border-radius: 50px; font-size: 12px; font-weight: 700; white-space: nowrap; color: #888; border: 1px solid transparent; }
        .chip.active { background: var(--pink); color: #fff; box-shadow: 0 4px 15px rgba(255,45,85,0.4); }

        /* News Feed: Arredondado e Imersivo */
        #feed { padding: 0 15px; }
        .post { background: var(--card); border-radius: 28px; margin-bottom: 20px; overflow: hidden; border: 1px solid #2c2c2e; position: relative; }
        .post-img { width: 100%; height: 400px; object-fit: cover; }
        .post-tag { position: absolute; top: 15px; left: 15px; background: var(--pink); padding: 5px 12px; border-radius: 10px; font-size: 10px; font-weight: 900; }
        .post-info { padding: 20px; }
        .post-title { font-size: 20px; font-weight: 900; line-height: 1.2; margin: 0; letter-spacing: -0.5px; }

        /* Player Estação: A Logo do Manequim flutuando */
        .station-ui { padding: 40px 20px; text-align: center; display: none; }
        .station-logo { width: 200px; height: 200px; border-radius: 40px; margin-bottom: 30px; border: 3px solid var(--pink); box-shadow: 0 20px 40px rgba(255,45,85,0.3); }
        .btn-play { background: #fff; color: #000; border: none; padding: 18px 60px; border-radius: 50px; font-weight: 900; font-size: 14px; box-shadow: 0 10px 20px rgba(255,255,255,0.2); }

        /* Tabbar Neon */
        .tabbar { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 70px; background: rgba(30,30,30,0.9); backdrop-filter: blur(20px); border-radius: 35px; display: flex; justify-content: space-around; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { color: #666; text-decoration: none; font-size: 10px; font-weight: 900; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-btn.active { color: var(--pink); }
    </style>
</head>
<body>

    <div id="h-l"></div><div id="h-r"></div>

    <div id="splash">
        <img src="icon.png.JPG" class="spin-logo">
        <h2 style="font-family:'Syncopate'; font-size:14px; margin-top:20px;">VITRIN<span>III</span></h2>
    </div>

    <header><div class="logo-txt">VITRIN<span>III</span></div></header>

    <div class="cat-scroll">
        <div class="chip active" onclick="Vitrin.tab('news', this)">🔥 SEU RADAR</div>
        <div class="chip" onclick="Vitrin.tab('station', this)">📻 ESTAÇÃO</div>
        <div class="chip" onclick="Vitrin.tab('charts', this)">📊 CHARTS</div>
    </div>

    <main id="view-news"><div id="feed"></div></main>

    <section id="view-station" class="station-ui">
        <img src="icon.png.JPG" class="station-logo">
        <h1 style="font-size:32px; font-weight:900; margin:0;">ESTAÇÃO V3</h1>
        <p style="color:#666; margin-bottom:30px;">LOCUTOR IA NO AR</p>
        <button class="btn-play" onclick="Vitrin.play()">PLAY BROADCAST</button>
        <div style="margin-top:40px;"><iframe style="border-radius:25px;" src="https://open.spotify.com/embed/playlist/37i9dQZEVXbMX86u6AIund3" width="100%" height="352" frameBorder="0" allow="autoplay; encrypted-media;"></iframe></div>
    </section>

    <footer class="tabbar">
        <div class="tab-btn active" onclick="location.reload()">HOME</div>
        <a href="https://www.tiktok.com/@vitriniii" class="tab-btn">TIKTOK</a>
        <div class="tab-btn" onclick="Vitrin.tab('news', this)">REDAÇÃO</div>
    </footer>

    <script src="core.js"></script>
    <script>
        window.onload = () => { Vitrin.init(); setTimeout(() => document.getElementById('splash').style.display='none', 2000); };
        
        let l=0, r=0;
        document.getElementById('h-l').onclick=()=>{l++;chk();};
        document.getElementById('h-r').onclick=()=>{r++;chk();};
        function chk(){ if(l>=2 && r>=2){location.href='dashboard.html'; l=0; r=0;} setTimeout(()=>{l=0;r=0;},2000);}
    </script>
</body>
</html>
