<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRIN III</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --yellow: #FFFF00; --bg: #000; }
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; padding-bottom: 80px; }
        #splash { position: fixed; inset: 0; background: var(--yellow); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 0.8s; }
        .persona { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #000; }
        .nav { height: 70px; display: flex; align-items: center; justify-content: center; background: #000; border-bottom: 2px solid var(--yellow); position: sticky; top: 0; z-index: 1000; }
        .tabs { display: flex; background: #000; border-bottom: 1px solid #222; position: sticky; top: 70px; z-index: 999; }
        .tab { flex: 1; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #444; }
        .tab.active { color: var(--yellow); border-bottom: 3px solid var(--yellow); }
        .ads-box { background: #080808; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #333; border-bottom: 1px solid #1a1a1a; }
        #feed { padding: 15px; }
        .card { background: #0A0A0A; border-radius: 25px; margin-bottom: 25px; overflow: hidden; border: 1px solid #1a1a1a; position: relative; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 1px solid var(--yellow); }
        .badge { position: absolute; top: -30px; right: 20px; width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--yellow); background-image: url('icon.png.JPG'); background-size: cover; }
    </style>
</head>
<body>
    <div id="splash"><img src="icon.png.JPG" class="persona"></div>
    <div class="nav"><h2 style="color:var(--yellow); margin:0;">VITRIN III</h2></div>
    <div class="ads-box">ESPAÇO GOOGLE ADSENSE</div>
    <div class="tabs">
        <div class="tab active" id="t1" onclick="Soberano.carregar('HYPE')">Radar</div>
        <div class="tab" id="t2" onclick="Soberano.carregar('SUBS')">Subcelebs</div>
        <div class="tab" id="t3" onclick="Soberano.carregar('X')">Trends</div>
    </div>
    <div id="feed"></div>
    <script src="core.js"></script>
    <script>
        window.onload = () => { Soberano.carregar('HYPE'); setTimeout(() => { document.getElementById('splash').style.display='none'; }, 2000); };
    </script>
</body>
</html>
