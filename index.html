<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VITRIN III | SECURE ACCESS</title>
    <link rel="apple-touch-icon" href="icon.png.JPG">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --neon: #FFFF00; --bg: #000; --glass: rgba(255, 255, 0, 0.05); }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; box-sizing: border-box; cursor: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; padding-bottom: 110px; overflow-x: hidden; }
        
        /* Gatilhos Invisíveis Biométricos */
        #trigger-l, #trigger-r { position: fixed; top: 0; width: 80px; height: 80px; z-index: 999999; }
        #trigger-l { left: 0; } #trigger-r { right: 0; }

        /* Splash Hacker */
        #splash { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000; transition: 1.2s cubic-bezier(0.95, 0.05, 0.795, 0.035); }
        .persona-img { width: 140px; height: 140px; border-radius: 50%; border: 2px solid var(--neon); box-shadow: 0 0 20px var(--neon); object-fit: cover; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px var(--neon); } 50% { box-shadow: 0 0 30px var(--neon); } 100% { box-shadow: 0 0 5px var(--neon); } }

        .header { height: 70px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--neon); position: sticky; top: 0; z-index: 1000; font-weight: 900; letter-spacing: 5px; color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        
        /* Estilo Hacker de Abas */
        .tabs { display: flex; background: #000; padding: 5px; border-bottom: 1px solid #111; position: sticky; top: 70px; z-index: 999; }
        .tab { flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #444; text-transform: uppercase; transition: 0.3s; }
        .tab.active { color: var(--neon); font-weight: 900; text-shadow: 0 0 5px var(--neon); border: 1px solid var(--neon); border-radius: 5px; }

        .card { background: #050505; border-radius: 5px; margin: 15px; border-left: 3px solid var(--neon); position: relative; overflow: hidden; }
        .card img { width: 100%; height: 280px; object-fit: cover; filter: grayscale(50%) contrast(120%); transition: 0.5s; }
        .card:hover img { filter: grayscale(0%) contrast(100%); }

        .tabbar { position: fixed; bottom: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); border-top: 1px solid var(--neon); display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(20px); }
        .scan-line { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,0,0.2); animation: scan 4s linear infinite; pointer-events: none; z-index: 99999; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100vh; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="scan-line"></div>
    <div id="trigger-l"></div>
    <div id="trigger-r"></div>

    <div id="splash">
        <img src="icon.png.JPG" class="persona-img">
        <div style="margin-top:20px; color:var(--neon); font-size:12px; letter-spacing:8px; animation: blink 1s infinite;">AUTHENTICATING...</div>
    </div>
    
    <div class="header">VITRIN_SYSTEM_v3.0</div>

    <div class="tabs">
        <div class="tab active" onclick="Soberano.tab('news', this)">RADAR_LIVE</div>
        <div class="tab" onclick="Soberano.tab('radio', this)">VOICE_TRANSMISSION</div>
        <div class="tab" onclick="Soberano.tab('opinion', this)">CORE_OPINION</div>
    </div>

    <div id="view-news"><div id="feed"></div></div>

    <div id="view-radio" style="display:none; padding:20px; text-align:center;">
        <div style="border:1px solid var(--neon); padding:40px; border-radius:10px;">
            <div id="wave" style="height:50px; display:flex; gap:3px; justify-content:center; align-items:center; margin-bottom:20px;">
                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            </div>
            <button onclick="Soberano.play()" style="background:none; border:1px solid var(--neon); color:var(--neon); padding:15px 30px; font-family:'JetBrains Mono'; letter-spacing:2px; cursor:pointer;">START_LOCUTION_IA</button>
        </div>
        <iframe style="margin-top:20px; border-radius:5px; border:1px solid #222;" src="https://open.spotify.com/embed/playlist/37i9dQZEVXbMXp61v9AI7o?utm_source=generator&theme=06" width="100%" height="352" frameBorder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <div id="view-opinion" style="display:none; padding:20px;"><div id="opinion-content"></div></div>

    <footer class="tabbar">
        <div onclick="location.reload()" style="color:var(--neon); font-size:10px; font-weight:900;">[ RELOAD_SIGNAL ]</div>
        <a href="https://www.tiktok.com/@vitriniii" target="_blank" style="color:#fff; font-size:10px; text-decoration:none;">[ TIKTOK_PORTAL ]</a>
    </footer>

    <script src="core.js"></script>
    <script>
        window.onload = () => { Soberano.init(); setTimeout(() => { document.getElementById('splash').style.display='none'; }, 2500); };
        
        let L = 0, R = 0;
        document.getElementById('trigger-l').onclick = () => { L++; check(); };
        document.getElementById('trigger-r').onclick = () => { R++; check(); };
        function check() {
            if (L >= 2 && R >= 2) { location.href = 'dashboard.html'; L=0; R=0; }
            setTimeout(() => { L=0; R=0; }, 2000);
        }
    </script>
</body>
</html>
