<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITRIN HQ</title>
    <style>
        body { background: #000; color: yellow; font-family: monospace; padding: 30px; }
        .box { border: 2px solid yellow; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
        input, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin: 10px 0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: yellow; color: #000; padding: 15px; border: none; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="box">
        <h2>COMANDO V3</h2>
        <label>OPINIÃO DA REDAÇÃO</label>
        <textarea id="t" placeholder="Escreva aqui sua opinião sensata..."></textarea>
        
        <label>MARCA PATROCINADORA</label>
        <input type="text" id="m" placeholder="Ex: Nike">
        
        <label>SLOGAN / CHAMADA</label>
        <input type="text" id="s" placeholder="Ex: O melhor estilo">

        <button onclick="enviar()">Injetar no App</button>
        <button onclick="location.href='index.html'" style="background:#111; color:#555; margin-top:10px;">Voltar</button>
    </div>
    <script>
        function enviar() {
            const data = { texto: document.getElementById('t').value, marca: document.getElementById('m').value, slogan: document.getElementById('s').value, timestamp: Date.now() };
            localStorage.setItem('v3_comando', JSON.stringify(data));
            alert("SINAL ENVIADO! O locutor já aprendeu a propaganda.");
        }
    </script>
</body>
</html>
