<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITRIN HQ</title>
    <style>
        body { background: #000; color: yellow; font-family: monospace; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { border: 2px solid yellow; padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; background: #050505; }
        input, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-top: 10px; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: yellow; color: #000; padding: 15px; border: none; font-weight: 900; margin-top: 20px; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="panel">
        <h2 style="text-align:center;">VITRIN III HQ</h2>
        <label>TEXTO DA REDAÇÃO</label>
        <textarea id="op" rows="3" placeholder="Escreva a opinião do dia..."></textarea>
        <label>MARCA PATROCINADORA</label>
        <input type="text" id="m" placeholder="Ex: Nike">
        <label>FRASE DO LOCUTOR</label>
        <input type="text" id="f" placeholder="Ex: O melhor estilo">
        <button onclick="salvar()">INJETAR SINAL</button>
        <button onclick="location.href='index.html'" style="background:#111; color:yellow; margin-top:10px;">VOLTAR</button>
    </div>
    <script>
        function salvar() {
            const d = { op: document.getElementById('op').value, marca: document.getElementById('m').value, frase: document.getElementById('f').value };
            localStorage.setItem('vitrin_v3_cmd', JSON.stringify(d));
            alert("SINAL ATUALIZADO NO VITRIN III!");
        }
    </script>
</body>
</html>
