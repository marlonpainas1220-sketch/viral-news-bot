<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VITRIN HQ</title>
    <style>body { background: #000; color: yellow; font-family: monospace; padding: 20px; } .box { border: 2px solid yellow; padding: 20px; border-radius: 15px; background: #050505; } input, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-top: 10px; border-radius: 8px; } button { width: 100%; background: yellow; color: #000; padding: 15px; border: none; font-weight: 900; margin-top: 20px; border-radius: 8px; }</style>
</head>
<body>
    <div class="box"><h2>HQ VITRIN III</h2><textarea id="op" placeholder="Opinião da Redação..."></textarea><input type="text" id="m" placeholder="Patrocinador"><input type="text" id="f" placeholder="Frase do Locutor"><button onclick="s()">Injetar Sinal</button><button onclick="location.href='index.html'" style="background:#111; color:yellow; margin-top:10px;">Voltar</button></div>
    <script>function s() { const d = { op: document.getElementById('op').value, marca: document.getElementById('m').value, frase: document.getElementById('f').value }; localStorage.setItem('v3_cmd', JSON.stringify(d)); alert("SINAL INJETADO!"); }</script>
</body>
</html>
