<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITRINIII | ADMIN_LUXE</title>
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #7F00FF, #E100FF); --bg-white: #FFFFFF; }
        body { background: var(--bg-white); font-family: 'Inter', sans-serif; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        input, textarea { width: 100%; border-radius: 12px; border: 1px solid #E0E0E0; padding: 15px; margin-bottom: 25px; }
        .btn-action { width: 100%; background: var(--primary-gradient); color: #fff; border: none; border-radius: 50px; padding: 18px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VITRINIII HQ</h1>
        <textarea id="txt_op" rows="4" placeholder="Editorial de Opinião..."></textarea>
        <input type="text" id="txt_marca" placeholder="Patrocinador">
        <input type="text" id="txt_frase" placeholder="Frase do Locutor">
        <button class="btn-action" onclick="injectData()">PUSH GLOBAL UPDATE</button>
        <button onclick="location.href='index.html'">LOGOUT</button>
    </div>
    <script>
        function injectData() {
            const data = { op: document.getElementById('txt_op').value, marca: document.getElementById('txt_marca').value, frase: document.getElementById('txt_frase').value };
            localStorage.setItem('v5_cmd', JSON.stringify(data));
            alert("SINAL INJETADO!");
        }
    </script>
</body>
</html>
