<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><title>VITRINIII HQ</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; padding: 40px; }
        .hq { max-width: 500px; margin: auto; }
        h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-style: italic; margin-bottom: 50px; }
        label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #444; display: block; margin-top: 30px; }
        textarea, input { width: 100%; background: #000; border: 0.5px solid #222; color: #fff; padding: 15px; margin-top: 10px; font-size: 16px; border-radius: 0; outline: none; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; margin-top: 50px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hq">
        <h1>HQ System</h1>
        <label>Editorial de Opinião</label>
        <textarea id="o" rows="4"></textarea>
        <label>Anunciante Master</label>
        <input type="text" id="m" placeholder="Ex: Prada">
        <label>Slogan Comercial</label>
        <input type="text" id="f" placeholder="Ex: Luxury is a choice">
        <button onclick="save()">Push Update</button>
        <button onclick="location.href='index.html'" style="background:none; color:#444; font-size:10px; margin-top:20px;">Exit System</button>
    </div>
    <script>
        function save() {
            const data = { op: document.getElementById('o').value, marca: document.getElementById('m').value, frase: document.getElementById('f').value };
            localStorage.setItem('v3_cmd', JSON.stringify(data));
            alert("SINAL ATUALIZADO");
        }
    </script>
</body>
</html>
