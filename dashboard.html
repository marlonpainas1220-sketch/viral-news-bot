<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"><title>HQ_BUNKER</title>
    <style>
        body { background: #000; color: #FF2D55; font-family: monospace; padding: 30px; }
        .box { border: 1px solid #FF2D55; padding: 40px; max-width: 500px; margin: auto; border-radius: 30px; }
        label { font-size: 10px; display: block; margin-top: 20px; color: #444; }
        input, textarea { width: 100%; background: #050505; border: 1px solid #222; color: #fff; padding: 15px; margin-top: 10px; border-radius: 15px; outline: none; }
        button { width: 100%; background: #FF2D55; color: #fff; border: none; padding: 20px; font-weight: 900; border-radius: 50px; margin-top: 40px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>COMMAND_CENTER</h1>
        <label>EDITORIAL_INJECTION</label>
        <textarea id="o" rows="4"></textarea>
        <label>SPONSOR_ID</label>
        <input type="text" id="m">
        <label>SLOGAN_VOICE</label>
        <input type="text" id="s">
        <button onclick="save()">INJECT_UPLINK</button>
        <button onclick="location.href='index.html'" style="background:none; color:#444; font-size:10px;">DISCONNECT</button>
    </div>
    <script>
        function save() {
            const d = { op: document.getElementById('o').value, marca: document.getElementById('m').value, frase: document.getElementById('s').value };
            localStorage.setItem('v3_cmd', JSON.stringify(d));
            alert("SINAL_INJETADO");
        }
    </script>
</body>
</html>
