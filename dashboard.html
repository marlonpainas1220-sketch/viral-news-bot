<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITRIN HQ</title>
    <style>
        body { background: #000; color: yellow; font-family: monospace; padding: 30px; }
        .box { border: 2px solid yellow; padding: 25px; border-radius: 15px; max-width: 400px; margin: auto; }
        input, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin: 10px 0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: yellow; color: #000; padding: 15px; border: none; font-weight: 900; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="box">
        <h2>COMANDO V3</h2>
        <label>OPINIÃO DA REDAÇÃO</label>
        <textarea id="t" placeholder="Escreva aqui sua opinião sensata..."></textarea>
        
        <label>MARCA PATROCINADORA</label>
        <input type="text" id="m" placeholder="Ex: Nike">
        
        <label>SLOGAN / CHAMADA</label>
        <input type="text" id="s" placeholder="Ex: O melhor estilo">

        <button onclick="enviar()">Injetar no App</button>
        <button onclick="location.href='index.html'" style="background:#111; color:#555; margin-top:10px;">Voltar</button>
    </div>
    <script>
        function enviar() {
            const data = { texto: document.getElementById('t').value, marca: document.getElementById('m').value, slogan: document.getElementById('s').value, timestamp: Date.now() };
            localStorage.setItem('v3_comando', JSON.stringify(data));
            alert("SINAL ENVIADO! O locutor já aprendeu a propaganda.");
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITRIN HQ | CONTROLO DE SINAL</title>
    <style>
        body { background: #000; color: #FFFF00; font-family: 'Courier New', monospace; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { border: 2px solid #FFFF00; padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; background: #050505; box-shadow: 0 0 40px rgba(255,255,0,0.1); }
        h2 { text-transform: uppercase; letter-spacing: 3px; text-align: center; border-bottom: 1px solid #222; padding-bottom: 15px; }
        label { display: block; margin-top: 20px; font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase; }
        input, textarea { width: 100%; background: #111; border: 1px solid #333; color: #fff; padding: 12px; margin-top: 8px; border-radius: 8px; box-sizing: border-box; font-family: sans-serif; }
        input:focus, textarea:focus { border-color: #FFFF00; outline: none; }
        button { width: 100%; background: #FFFF00; color: #000; padding: 18px; border: none; font-weight: 900; margin-top: 25px; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        .back-btn { background: #111; color: #555; margin-top: 10px; border: 1px solid #222; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>VITRIN III HQ</h2>
        
        <label>🎙️ REDAÇÃO / OPINIÃO SOBERANA</label>
        <textarea id="op" rows="4" placeholder="Escreva o texto que aparecerá na aba Redação..."></textarea>
        
        <label>💰 PATROCINADOR (MARCA)</label>
        <input type="text" id="m" placeholder="Ex: Nike, TikTok, Loja do Zé">
        
        <label>✨ FRASE DO LOCUTOR (VINHETA)</label>
        <input type="text" id="s" placeholder="Ex: O melhor estilo do Brasil">

        <button onclick="injetarSinal()">Injetar no App</button>
        <button class="back-btn" onclick="location.href='index.html'">Voltar ao Feed</button>
    </div>

    <script>
        function injetarSinal() {
            const data = {
                op: document.getElementById('op').value,
                marca: document.getElementById('m').value,
                frase: document.getElementById('s').value,
                time: Date.now()
            };
            // Salva no navegador para o core.js ler
            localStorage.setItem('vitrin_v3_cmd', JSON.stringify(data));
            alert("SINAL INJETADO! O locutor e a redação já foram atualizados com sucesso.");
        }
    </script>
</body>
</html>
